services:
  - type: web
    name: cashjet-aviator
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PAYHERO_API_URL
        value: https://backend.payhero.co.ke/api/v2/payments
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYHERO_API_USERNAME
        sync: false
      - key: PAYHERO_API_PASSWORD
        sync: false
      - key: PAYHERO_CALLBACK_URL
        sync: false
